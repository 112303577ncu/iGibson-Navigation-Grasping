name: tests

# Every suite below runs without a robot: no serial port, no camera, no ROS.
# That is deliberate -- the hardware-dependent behaviour is covered by fakes and
# recorded fixtures, so a regression in the safety guards or the mission machine
# is caught here rather than next to a moving robot.

on:
  push:
    branches: [main, v23-grasp-test, 'merge-**', 'codex/mission-recovery-*']
  pull_request:
    branches: [main, v23-grasp-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # The deployment requirements live under grasp/ and detection/ and are
          # pinned for the Jetson's Python 3.8, so they are neither at a path
          # setup-python discovers by default nor installable here.
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch only, and from PyTorch's index rather than PyPI, whose
          # default wheel is the CUDA build. The Jetson runs an NVIDIA-built
          # wheel that is not installable here, and no test touches a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Grasp deployment controller (135 checks)
        run: python grasp/v21/test_deploy_controller.py

      - name: Servo reads over the half-duplex bus (37 checks)
        run: python grasp/v21/test_servo_read.py

      - name: Preventive floor guard (641 checks)
        run: python grasp/v21/test_deploy_floor_guard.py

      - name: V24 candidate artifact and release identity
        run: python grasp/v24/test_candidate_package.py

      - name: V23 finalist resident stack
        run: |
          python grasp/v23/test_deploy_controller.py
          python grasp/v23/test_servo_read.py
          python grasp/v23/test_deploy_floor_guard.py
          python grasp/v23/test_one_command_launcher.py
          python grasp/v23/test_three_pose_scan.py
          python grasp/v23/test_chassis_server.py
          python grasp/v23/test_odom_bridge.py
          python grasp/v23/test_travel_pose.py
          python grasp/v23/test_startup_pose.py
          python -m pytest tests/test_g2_safety_audit.py tests/test_g2_demo_supervisor.py tests/test_v23_demo.py tests/test_v23_recovery.py -q

      - name: Safety guards
        run: python tests/test_safety_guards.py

      - name: Mission layer, end to end
        run: python tests/test_mission_end_to_end.py

      - name: Model packaging
        run: python tests/test_model_package.py

      - name: Grasp-home homography
        run: python tests/test_grasp_home_homography.py

      - name: Camera capture recovery
        run: python tests/test_stream_cam_capture.py

      - name: Vision bridge pose
        run: python tests/test_vision_grasp_bridge_pose.py

      - name: Offboard SAM2 target adapter (sign convention)
        run: python tests/test_trash_target.py

      - name: Operator console
        run: python ui/test_server.py

      - name: Dynamic ROS IP and serial-owner helpers
        run: bash deploy/systemd/test_helpers.sh

      # The three pure-logic selftests. They need neither hardware nor torch,
      # and they are the fastest thing that will tell you the FSM wiring broke.
      - name: Mission FSM selftest
        run: python integration/mission_fsm.py --selftest

      - name: Mission pipeline selftest
        run: python integration/mission_pipeline.py --selftest

      - name: G2 navigation TCP safety client
        run: python tests/test_g2_nav_client.py

      - name: G2 mapping, patrol geometry and empty release preview
        run: python -m pytest tests/test_g2_quarter_turn_calibration.py tests/test_g2_mapping_route.py tests/test_g2_patrol_policy.py tests/test_g2_relative_dock_probe.py tests/test_v23_release_preview.py -q

      - name: Vision grasp pipeline selftest
        run: python integration/vision_grasp_pipeline.py --selftest

      - name: Resident navigation recovery and dropoff handoff
        run: python -m pytest tests/test_g2_localization_service.py tests/test_g2_amcl_watchdog_runtime.py tests/test_v23_task_resume_guard.py tests/test_g2_ros_self_return_filter.py tests/test_lidar_self_return_filter.py tests/test_v23_dock_approach.py tests/test_g2_navigation_goals.py tests/test_v23_delivery_navigation.py tests/test_g2_aruco_corner_seed.py tests/test_g2_corner_snapshot.py tests/test_g2_corner_camera_capture.py tests/test_g2_boot_idle.py -q

      - name: Koala approach import and target compatibility
        run: python -m pytest tests/test_target_approach.py tests/test_sugarbox_approach_grasp.py tests/test_sugarbox_blind_finish.py tests/test_sugarbox_ground_calibration.py tests/test_sugarbox_lidar_geometry.py tests/test_sugarbox_rear_ignore.py tests/test_sugarbox_seed_target.py tests/test_placement_dock.py tests/test_mission_loop.py tests/test_capture_rear_dataset.py tests/test_v23_koala_map_handoff.py -q

      - name: AMCL supervisor and bounded task recovery
        run: python -m pytest tests/test_g2_amcl_watchdog_runtime.py tests/test_g2_mission_recovery.py tests/test_g2_prepare_koala.py tests/test_g2_boundary_recovery.py tests/test_g2_patrol_reentry.py tests/test_g2_placement_corridor.py tests/test_g2_offline_workspace_plan.py tests/test_v23_mission_entry.py -q
